workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Grant execute permission
        script: chmod +x gradlew
      - name: Build Android APK
        script: ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
